[theme]
base = "light"
primaryColor = "#0C5D49"
backgroundColor = "#F4F7F5"
secondaryBackgroundColor = "#EAF4ED"
textColor = "#0F1A15"
borderColor = "#D0DAD4"
font = "Inter, 'Segoe UI', system-ui, sans-serif"
baseRadius = "8px"

[client]
toolbarMode = "minimal"

[browser]
# Streamlit's usage statistics (webhooks.fivetran.com): off for privacy and a clean console.
gatherUsageStats = false
